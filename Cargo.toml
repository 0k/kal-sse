[package]
name = "kal-sse"
version = "%%version%%"
edition = "2021"
rust-version = "1.82"
authors = ["Valentin Lab <valentin.lab@kalysto.org>"]
description = "Resilient Server-Sent Events: snapshot + cursor data channels with gap-free reconnect"
license = "MIT"
repository = "https://github.com/0k/kal-sse"
readme = "README.md"
keywords = ["sse", "event-stream", "resilient", "cursor", "snapshot"]
categories = ["web-programming", "asynchronous"]
exclude = [
    "AGENTS.md",
    "CLAUDE.md",
    "CLAUDE.local.md",
    "README.org",
    "autogen.sh",
    ".gitchangelog.rc",
    ".gitignore",
    ".package.d/",
    ".pkg/",
    "/doc/",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `core` only by default — framework-agnostic, no HTTP types.
default = []
# Opt-in axum adapter (turns a `Replay` into an `axum` SSE response,
# looks up the server-side cursor by `?sub=<uuid>`, emits
# `409 needs_snapshot` on unknown / expired sub, tags events with
# `id:`, applies keep-alive).
axum = ["dep:axum", "dep:serde_json", "dep:async-stream", "dep:futures-core"]

[dependencies]
tokio = { version = "1", features = ["sync", "time"] }
uuid = { version = "1", features = ["v4"] }
axum = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
async-stream = { version = "0.3", optional = true }
futures-core = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "time", "macros", "rt", "rt-multi-thread"] }
futures = "0.3"
